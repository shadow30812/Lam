; pio run -e sensor -t upload
; pio run -e controller -t upload -t monitor

[platformio]
default_envs = sensor

[env]
platform = espressif32@6.9.0
board = nodemcu-32s
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 460800
monitor_speed = 115200
monitor_filters = direct, log2file
build_flags = -Wall

[env:controller]
build_src_filter = +<controller/>

[env:sensor]
build_src_filter = +<sensor/>
lib_deps =
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
