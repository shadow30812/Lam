; Team 13 · Chocolate batch plant · Lam Research Challenge 2026 Stage 3
;
; One project, two boards:
;   env:controller -> ESP32 #1 (U2): valves, pumps, start switch, batch sequence
;   env:sensor     -> ESP32 #2 (U7): counts the three flow sensors, streams counts to U2
;
; Upload:   pio run -e controller -t upload --upload-port <U2 port>
;           pio run -e sensor     -t upload --upload-port <U7 port>
; Monitor:  pio device monitor -e controller --port <U2 port>

[platformio]
default_envs = controller, sensor

[env]
platform = espressif32@6.9.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
monitor_filters = direct
build_flags = -Wall

[env:controller]
build_src_filter = +<controller/>

[env:sensor]
build_src_filter = +<sensor/>
