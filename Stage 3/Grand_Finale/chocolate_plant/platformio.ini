; Team 13 · Chocolate batch plant · Lam Research Challenge 2026 Stage 3
;
; One project, two boards, ONE USB cable, Linux port /dev/ttyUSB0:
;   env:controller -> ESP32 #1 (U2): valves, pumps, start switch, batch sequence
;   env:sensor     -> ESP32 #2 (U7): counts the three flow sensors, streams counts to U2
;
; 1. Cable on ESP32 #2 (U7):  pio run -e sensor -t upload
; 2. Move cable to ESP32 #1 (U2):  pio run -e controller -t upload -t monitor
; A plain "pio run -t upload" only flashes the controller, so the sensor code
; can never land on the wrong board by accident.

[platformio]
default_envs = controller

[env]
platform = espressif32@6.9.0
board = nodemcu-32s
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 460800
monitor_speed = 115200
monitor_filters = direct
build_flags = -Wall

[env:controller]
build_src_filter = +<controller/>

[env:sensor]
build_src_filter = +<sensor/>
